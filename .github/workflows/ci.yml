# Continuous integration (Phase 5a-bis). Linux only, 15 minutes at most per job (private
# repository: GitHub Actions minutes are counted). Three jobs in parallel (2026-10-23, the suite
# had grown to 14 min 30 in one job): the static checks and the database tests, then the
# end-to-end suite once per device (Pixel 7 / Chromium, iPhone 14 / WebKit), each with its own
# local stack and only its own browser.
#
# Everything runs against a LOCAL Supabase stack started inside the job (`supabase start`): the
# remote project is never contacted, and no repository secret is used. The VAPID keys, the push
# route secret and a throwaway TLS certificate are generated in the job (scripts/ci/local-env.mjs);
# the Supabase keys are the local stack's own.
name: CI

on:
  push:
    branches: ["**"]
    # Documentation only: no run (Actions minutes are counted on a private repository).
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # A pull request from a branch of this repository is already checked by the push of that
    # branch (same commit): only pull requests from forks run again.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The Docker images download in the background while the static checks run.
      - name: Start local Supabase (background)
        run: |
          (pnpm exec supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,postgres-meta \
            > "$RUNNER_TEMP/supabase.log" 2>&1; echo $? > "$RUNNER_TEMP/supabase.exit") &

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Unit tests
        run: pnpm test

      - name: Wait for the local Supabase stack
        run: scripts/ci/wait-for.sh supabase

      - name: Database tests (pgTAP)
        run: pnpm exec supabase test db

  e2e:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # The runner image already has Chrome and its libraries: Chromium needs no apt package.
          # WebKit needs its own (GStreamer, codecs…), installed by apt.
          - project: pixel-7
            browser: chromium
            deps: ""
          - project: iphone-14
            browser: webkit
            deps: "--with-deps"
    name: e2e (${{ matrix.project }})
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The browser binaries are kept between runs (same Playwright version, same key).
      - name: Cache the browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ matrix.browser }}-${{ hashFiles('pnpm-lock.yaml') }}

      # apt was slow or stalled on its mirror several times (CI n° 55, 61, 62, 64: up to 8 minutes,
      # once past the 15-minute limit). A stalled download is abandoned after 15 s and retried, and
      # the packages WebKit needs are kept between runs, so apt mostly has nothing to download.
      - name: Retries, timeouts and kept packages for apt
        run: |
          printf '%s\n' 'Acquire::Retries "5";' 'Acquire::http::Timeout "15";' \
            'Acquire::https::Timeout "15";' 'APT::Keep-Downloaded-Packages "true";' \
            'Binary::apt::APT::Keep-Downloaded-Packages "true";' \
            | sudo tee /etc/apt/apt.conf.d/80-ci > /dev/null

      - name: Cache the apt packages of the browser
        if: matrix.deps != ''
        uses: actions/cache@v4
        with:
          path: ~/apt-cache
          key: apt-${{ matrix.browser }}-ubuntu-24.04-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: apt-${{ matrix.browser }}-ubuntu-24.04-

      - name: Restore the kept apt packages
        if: matrix.deps != ''
        run: |
          if compgen -G "$HOME/apt-cache/*.deb" > /dev/null; then
            sudo cp "$HOME"/apt-cache/*.deb /var/cache/apt/archives/
          fi

      # The captcha of Supabase Auth is on in production (Turnstile): the end-to-end tests run with
      # it on too, with Cloudflare's official test secret (always passes, accepts only the dummy
      # token of the test site key). Only in this job's copy of the configuration.
      - name: Captcha on in the local stack (Cloudflare test keys)
        run: |
          printf '%s\n' '' '[auth.captcha]' 'enabled = true' 'provider = "turnstile"' \
            'secret = "1x0000000000000000000000000000000AA"' >> supabase/config.toml
          echo "E2E_CAPTCHA=true" >> "$GITHUB_ENV"

      # The two slow downloads (Docker images, the browser) run in the background while the
      # application builds; each one writes its exit code to a file that a later step waits for.
      - name: Start local Supabase and install the browser (background)
        run: |
          (pnpm exec supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,postgres-meta \
            > "$RUNNER_TEMP/supabase.log" 2>&1; echo $? > "$RUNNER_TEMP/supabase.exit") &
          (pnpm exec playwright install ${{ matrix.deps }} ${{ matrix.browser }} \
            > "$RUNNER_TEMP/browsers.log" 2>&1; echo $? > "$RUNNER_TEMP/browsers.exit") &

      - name: Wait for the local Supabase stack
        run: scripts/ci/wait-for.sh supabase

      - name: Local environment (generated secrets, local stack only)
        run: node scripts/ci/local-env.mjs "$GITHUB_ENV"

      - name: Build
        run: pnpm build

      - name: Wait for the browser
        run: scripts/ci/wait-for.sh browsers

      - name: Keep the apt packages for the next run
        if: matrix.deps != ''
        run: |
          mkdir -p "$HOME/apt-cache"
          if compgen -G "/var/cache/apt/archives/*.deb" > /dev/null; then
            cp /var/cache/apt/archives/*.deb "$HOME/apt-cache/"
          fi

      - name: End-to-end (${{ matrix.project }})
        run: pnpm exec playwright test --project=${{ matrix.project }}

      - name: Keep the traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ matrix.project }}
          path: test-results/
          retention-days: 3
          if-no-files-found: ignore
